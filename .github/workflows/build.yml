name: Build Mod Menu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip Kzin-Mod-Menu.zip

    - name: Fix File Timestamps (CRITICAL)
      run: |
        find Kzin-Mod-Menu -exec touch {} +
        touch Kzin-Mod-Menu/app/src/main/jni/Main.cpp

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Build Release APK
      run: |
        cd Kzin-Mod-Menu
        gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Menu-Output
        path: Kzin-Mod-Menu/app/build/outputs/apk/release/
