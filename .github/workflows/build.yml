name: Build Mod Menu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x Android-Mod-Menu-5.0/gradlew

    - name: Build with Gradle
      run: cd Android-Mod-Menu-5.0 && ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Menu-Output
        path: Android-Mod-Menu-5.0/app/build/outputs/apk/release/
