name: Build Mod Menu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip Mod Menu Project
      run: unzip Android-Mod-Menu-5.0.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      run: |
        cd Android-Mod-Menu-5.0
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Menu-Output
        path: Android-Mod-Menu-5.0/app/build/outputs/apk/release/
